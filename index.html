<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>vMix Ticker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'NRT Bold', 'Noto Sans Arabic', sans-serif;
            overflow: hidden;
        }

        .ticker-container {
            width: 1920px; /* قەبارەی شاشە بۆ vMix */
            height: 80px;
            background: linear-gradient(90deg, rgba(15,15,15,0.95) 0%, rgba(35,35,35,0.95) 100%);
            display: flex;
            align-items: center;
            border-bottom: 4px solid #ff9900;
            border-top: 2px solid #444;
            box-sizing: border-box;
            position: relative;
        }

        .ticker-title {
            background-color: #ff9900;
            color: #000;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 30px;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            box-shadow: 5px 0px 15px rgba(0,0,0,0.5);
        }

        .ticker-wrap {
            overflow: hidden;
            white-space: nowrap;
            flex-grow: 1;
            position: relative;
        }

        .ticker-move {
            display: inline-block;
            animation: ticker 25s linear infinite;
            padding-left: 100%;
        }

        .ticker-item {
            display: inline-block;
            color: #ffffff;
            font-size: 26px;
            padding: 0 40px;
        }

        .ticker-item span {
            color: #ff9900;
            font-weight: bold;
            margin-left: 10px;
        }

        @keyframes ticker {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }
    </style>
</head>
<body>

    <div class="ticker-container">
        <div class="ticker-title">بەرنامەکانی ئەمشەو</div>
        <div class="ticker-wrap">
            <div class="ticker-move">
                <div class="ticker-item"><span>٠٦:٠٠ م:</span> بەرنامەی منداڵان</div>
                <div class="ticker-item"><span>٠٧:٠٠ م:</span> هەواڵەکان و ڕووداوە ڕۆژانەکان</div>
                <div class="ticker-item"><span>٠٨:٠٠ م:</span> حیوانات (گیانەوەرە کێوییەکان)</div>
                <div class="ticker-item"><span>٠٩:٠٠ م:</span> دراماى تایبەت</div>
                <div class="ticker-item"><span>١٠:٠٠ م:</span> ژیانی لادێ (حياة القرية)</div>
            </div>
        </div>
    </div>

</body>
</html>
